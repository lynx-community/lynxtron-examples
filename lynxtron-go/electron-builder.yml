productName: Lynxtron Go
appId: com.lynxtron.go
directories:
  buildResources: resources
  output: dist
  app: dist/desktop
files:
  - index.js
  - '**/*.lynx.bundle'
  - '**/*.js'
  - '**/*.css'
  - '**/*.html'
  - '**/*.json'
  - '**/*.jsn'
  - '**/*.png'
  - '**/*.exe'
  - 'node_modules/**'
  - '!node_modules/.pnpm/**'
  - '!node_modules/.cache/**'
  - '!node_modules/.store/**'
asar: true
asarUnpack:
  - statics/
  - 'node_modules/@lynx-js/lynxtron/dist/**/*'
  - 'node_modules/lynxtron-scintilla-editor/**/*.node'
npmRebuild: false
extraResources:
  - from: src/assets
    to: assets
  # Lynx <image> reads file:// itself and cannot read inside app.asar. Keep
  # display assets beside app.asar and resolve this root at runtime.
  - from: resources/lynxtron.png
    to: brand/lynxtron.png
  - from: src/assets/lynxtron-on-dark.png
    to: brand/lynxtron-on-dark.png
  - from: thumbnails
    to: thumbnails
  - from: resources/builtin-showcases
    to: builtin-showcases
  # Opened by the platform browser, which cannot read an app.asar path.
  - from: src/main/desktop/help.html
    to: help.html
icon: lynxtron.png
electronBranding:
  projectName: lynxtron
  productName: Lynxtron
mac:
  notarize: true
  hardenedRuntime: true
  target:
    - dmg
  artifactName: lynxtron-go-darwin-${arch}.${ext}
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: Lynxtron Go
        CFBundleURLSchemes:
          - lynxtron-go
          - Lynxtron-Go
win:
  target:
    - target: nsis
      arch: x64
  artifactName: LynxtronGo-win-x64.${ext}
  asar: false
  extraFiles:
    - from: node_modules/@lynx-js/lynxtron/dist/win32/x64/lynxtron.exe
      to: lynxtron.exe
    - from: dist/desktop/node_modules/@lynx-js/lynxtron
      to: resources/app/node_modules/@lynx-js/lynxtron
nsis:
  include: resources/installer.nsh
  artifactName: LynxtronGo-win-x64-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
