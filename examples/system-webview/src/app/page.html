<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local page</title>
  <style>
    /* showcase tokens */
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: var(--bg); }
    body {
      margin: 0; padding: 20px; min-height: 100vh;
      font: 14px/1.5 system-ui, sans-serif; color: var(--text);
      background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    p { margin: 4px 0 20px; color: var(--muted); }
    .counter {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px; background: var(--deep); border: 1px solid var(--hairline); border-radius: 4px;
    }
    label { display: block; color: var(--muted); font-size: 12px; }
    output { font: 28px/1.3 var(--font-mono); }
    button {
      font: inherit; font-weight: 600; color: var(--text); background: var(--accent-bg);
      border: 1px solid var(--accent); border-radius: 3px; padding: 6px 14px; cursor: pointer;
    }
    button:hover { background: #244d65; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>Local page</h1>
  <p>This HTML page runs inside the system WebView.</p>
  <div class="counter">
    <div><label for="count">Page interactions</label><output id="count">0</output></div>
    <button type="button" id="increment">Increment</button>
  </div>
  <script>
    const count = document.getElementById('count');
    document.getElementById('increment').addEventListener('click', () => {
      count.value = String(Number(count.value) + 1);
    });
  </script>
</body>
</html>
