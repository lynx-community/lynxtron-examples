packages:
  - 'packages/*'
  - 'showcases/*'
  - 'lynxtron-go'
  - 'lynxtron-go/scintilla-extension'

# pnpm 11 reads this here rather than from package.json's `pnpm` field. Kept in
# both places so either pnpm major runs these postinstalls — @lynx-js/lynxtron's
# downloads the runtime binary, and skipping it yields an install that looks
# fine and an app that cannot start.
onlyBuiltDependencies:
  - '@lynx-js/lynxtron'
  - '@lynx-js/lynxtron-builder'
  - 'better-sqlite3'

allowBuilds:
  '@lynx-js/lynxtron': true
  '@lynx-js/lynxtron-builder': true
  core-js: true
  esbuild: true
  sqlite3: true
  electron-winstaller: true
  open-computer-use: true

catalog:
  '@lynx-js/lynxtron': 0.0.1-alpha.40
  '@lynx-js/lynxtron-builder': 0.0.1-alpha.40
  '@lynx-js/lynxtron-dev-plugins': 0.0.1-alpha.40
  '@lynx-js/lynx-library-headers': 0.0.1-alpha.40
  '@lynx-js/lynxtron-rebuild': 0.0.1-alpha.40
  '@lynx-js/config-rsbuild-plugin': 0.2.0
  '@lynx-js/react': 0.123.1
  '@lynx-js/react-rsbuild-plugin': ^0.18.1
  '@lynx-js/rspeedy': ^0.16.1
  '@lynx-js/type-config': 4.1.3
  '@lynx-js/types': 4.1.0
  '@rspack/cli': ^2.1.7
  '@rspack/core': ^2.1.7
  better-sqlite3: 13.0.2
  concurrently: ^8.2.2
  cross-env: ^10.1.0
  typescript: ~5.9.3
