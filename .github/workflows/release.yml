name: Release

# npm publish pipeline driven by Changesets.
#
# - Opens/updates the "Version Packages" PR when changesets are pending.
# - Once that PR is merged, publishes updated packages to npm.
#
# A Go version bump automatically calls release-installers.yml after this
# job succeeds. Go is private, so publishedPackages cannot be the trigger.
#
# Note: this pipeline runs `changeset publish --no-git-tag` and passes
# `createGithubReleases: false` to changesets/action, so no git tags or
# GitHub Releases are produced here. Installer Releases are created by
# `release-installers.yml` on demand.

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  prepare:
    name: Detect release changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go-version: ${{ steps.go.outputs.version }}
      go-changed: ${{ steps.go.outputs.changed }}
      showcases-changed: ${{ steps.go.outputs.showcases-changed }}
      has-changesets: ${{ steps.pending.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect version bumps
        id: go
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/go-release.mjs detect
      - name: Detect pending changesets
        id: pending
        run: node scripts/pending-changesets.mjs

  version-pr:
    name: Update Version Packages PR
    needs: prepare
    if: needs.prepare.outputs.has-changesets == 'true'
    runs-on: macos-latest
    concurrency:
      group: release-version-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued version job must update the PR against current main.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: |
          npm i -g corepack@latest --force
          corepack enable
          pnpm install --frozen-lockfile
      - name: Create or update Version Packages PR
        uses: changesets/action@v1
        with:
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: prepare
    if: needs.prepare.outputs.has-changesets == 'false'
    runs-on: macos-latest
    environment: npm
    concurrency:
      group: release-npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Full history so Changesets can generate changelogs.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: |
          # OIDC trusted publishing requires npm >=11.5.1; Node 22 ships with
          # npm 10.x. Pin to 11.x because npm 12 turned unknown CLI flags into
          # errors, which trips `pnpm publish` forwarding `--no-git-checks` to
          # `npm publish`.
          npm i -g npm@11
          npm i -g corepack@latest --force
          corepack enable
          pnpm install

      - name: Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  installers:
    name: Publish Go installers
    needs: [prepare, publish]
    if: needs.prepare.outputs.go-changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-installers.yml
    with:
      source-sha: ${{ github.sha }}
      expected-version: ${{ needs.prepare.outputs.go-version }}
    secrets: inherit

  showcases:
    name: Publish showcase updates for current Go
    needs: [prepare, publish]
    if: needs.prepare.outputs.go-changed == 'false' && needs.prepare.outputs.showcases-changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-showcases.yml
    with:
      source-sha: ${{ github.sha }}
      expected-version: ${{ needs.prepare.outputs.go-version }}
