name: Release Installers

# Build native installers (mac dmg / win exe) and showcase tarballs, then
# attach them as assets to a GitHub Release (created on demand if the tag
# does not exist yet).
#
# Called automatically after a Changesets Go version bump. Manual dispatch
# remains available for previews and retries. Both paths use the same version
# checks, pinned checkout and build steps.

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      expected-version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      validate-showcases:
        description: Also exercise standalone showcase builds without publishing a stable channel
        type: boolean
        default: false
      tag:
        description: >
          Optional assertion of the generated tag. Must match the Go
          package version: lynxtron-go-v<version> on main, or
          lynxtron-go-v<version>-dev.<sha6> on other branches.
        required: false
        type: string

permissions: {}

concurrency:
  # A literal group avoids deadlocking with the caller's Release group.
  group: lynxtron-go-installers
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and validate release identity
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: node scripts/go-release.mjs resolve
      - name: Refuse to overwrite a tag from another commit
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_SHA: ${{ steps.tag.outputs.sha }}
        with:
          script: |
            let object;
            try {
              const { data } = await github.rest.git.getRef({
                ...context.repo, ref: `tags/${process.env.RELEASE_TAG}`,
              });
              object = data.object;
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            while (object.type === 'tag') {
              const { data } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha });
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== process.env.SOURCE_SHA) {
              core.setFailed('Release tag belongs to another commit. Bump Go version or rerun the original release run.');
            }

  installers:
    name: Installers (${{ matrix.os }})
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Builds run independently; only the final publish job creates a Release.
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            slug: mac-arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
            slug: mac-x64
          - os: windows-2022
            platform: win32
            arch: x64
            slug: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          node -e "if(process.platform!==process.env.RELEASE_PLATFORM || process.arch!==process.env.RELEASE_ARCH) throw Error('Runner architecture mismatch')"
          npm i -g corepack@latest --force
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify Changesets to distribution triggers
        run: node --test scripts/changeset-release.test.mjs scripts/showcase-channel.test.mjs

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/lynxtron-go-signing.p12"
          keychain_path="$RUNNER_TEMP/lynxtron-go-signing.keychain-db"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      # macOS: dmg installer + publishable showcase tarballs (native .node
      # addons are host-platform specific, so tarballs are built here).
      - name: Build macOS installer
        if: runner.os == 'macOS'
        env:
          LYNXTRON_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/lynxtron-notarization.p8
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"
          pnpm --dir lynxtron-go run pack

      - name: Verify macOS distribution
        if: runner.os == 'macOS'
        run: |
          app_path=$(find lynxtron-go/dist -type d -name 'Lynxtron Go.app' -print -quit)
          test -n "$app_path"
          node scripts/verify-native-arch.cjs "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Pack showcases
        if: runner.os == 'macOS'
        run: node scripts/pack-showcases.mjs --platform ${{ matrix.slug }}

      # Windows: nsis installer.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          LYNXTRON_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: pnpm --dir lynxtron-go run pack:win

      # Windows: publishable showcase tarballs. Native .node addons are
      # host-platform specific, so we build a `-win` variant alongside the
      # macOS `-mac` variant; the baked release URL in each installer already
      # points at its matching platform slug.
      - name: Pack showcases (Windows)
        if: runner.os == 'Windows'
        run: node scripts/pack-showcases.mjs --platform ${{ matrix.slug }}

      - name: Stage release assets
        env:
          SHOWCASE_ACCEPTANCE_DIR: ${{ github.workspace }}/dist/showcase-artifacts
        run: pnpm --dir lynxtron-go exec vitest run scripts/showcase-artifacts.acceptance.test.ts

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: go-release-${{ matrix.os }}
          overwrite: true
          if-no-files-found: error
          path: |
            lynxtron-go/dist/*.dmg
            lynxtron-go/dist/*.exe
            dist/showcase-artifacts/*.tgz

      - name: Clean up macOS signing materials
        if: runner.os == 'macOS' && always()
        run: |
          security delete-keychain "$RUNNER_TEMP/lynxtron-go-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/lynxtron-go-signing.p12"
          rm -f "$RUNNER_TEMP/lynxtron-notarization.p8"

  publish:
    name: Publish complete Go release
    needs: [prepare, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: go-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify all architectures are present
        shell: bash
        run: |
          # upload-artifact preserves paths relative to the common ancestor
          # of lynxtron-go/dist and dist/showcase-artifacts (the repo root).
          # merge-multiple merges artifact roots; it does not flatten files.
          test -f release-assets/lynxtron-go/dist/lynxtron-go-darwin-arm64.dmg
          test -f release-assets/lynxtron-go/dist/lynxtron-go-darwin-x64.dmg
          test -n "$(find release-assets/lynxtron-go/dist -name '*.exe' -print -quit)"
          for asset in release-assets/dist/showcase-artifacts/*-mac-arm64.tgz; do
            test -f "$asset"
            name=${asset%-mac-arm64.tgz}
            test -f "${name}-mac-x64.tgz"
            test -f "${name}-win-x64.tgz"
          done
      - name: Build initial full showcase index
        env:
          SHOWCASE_ASSETS_DIR: release-assets/dist/showcase-artifacts
          INITIAL_RELEASE: 'true'
        run: node scripts/showcase-channel.mjs index
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.tgz
            release-assets/**/showcase-index.json
      - name: Initialize stable Go showcase channel
        if: needs.prepare.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHOWCASE_ASSETS_DIR: release-assets/dist/showcase-artifacts
        run: node scripts/showcase-channel.mjs seed

  validate-showcases:
    if: inputs.validate-showcases == true
    needs: [prepare, publish]
    permissions:
      # Reusable workflow declares publishing permissions even though validation
      # skips that job. GitHub checks the permission ceiling before evaluating if.
      contents: write
    uses: ./.github/workflows/release-showcases.yml
    with:
      source-sha: ${{ needs.prepare.outputs.sha }}
      expected-version: ''
      validation-only: true
